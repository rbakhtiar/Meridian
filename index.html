<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f4">
  <title>Meridian — Your work, connected.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="#" data-view="dashboard">
      <span class="brand-mark">M</span>
      <span>meridian</span>
    </a>

    <div class="workspace-label">WORKSPACE</div>

    <nav class="navigation">
      <button class="nav-item active" data-view="dashboard">
        <span>◫</span> Overview
      </button>
      <button class="nav-item" data-view="projects">
        <span>▤</span> Projects
      </button>
      <button class="nav-item" data-view="goals">
        <span>◎</span> Goals
      </button>
      <button class="nav-item" data-view="tasks">
        <span>☷</span> Tasks
      </button>
      <button class="nav-item" data-view="timeline">
        <span>◷</span> Timeline
      </button>
      <button class="nav-item" data-view="intelligence">
        <span>✳</span> Intelligence
      </button>
    </nav>

    <div class="sidebar-bottom">
      <div class="profile">
        <div class="avatar">R</div>
        <div>
          <strong>My Workspace</strong>
          <small>Personal account</small>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="breadcrumb" id="breadcrumb">Workspace / Overview</div>
      <div class="top-actions">
        <span class="status-dot"></span>
        <span class="saved-label">Locally saved</span>
        <button class="icon-button" id="commandButton" title="Command palette">⌘ K</button>
      </div>
    </header>

    <section class="content" id="app">
      <div class="loading">Preparing your workspace...</div>
    </section>
  </main>
</div>

<div class="command-overlay hidden" id="commandOverlay">
  <div class="command-box">
    <input id="commandInput" placeholder="Where would you like to go?">
    <div id="commandResults"></div>
    <small>ESC to close · Enter to open</small>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
