
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f8f5">

  <title>Meridian — Your work, connected.</title>
  <meta name="description" content="Meridian is your personal workspace for projects, goals, tasks, and ideas.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
</head>

<body>
  <div class="app-shell">

    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <span>Meridian</span>
      </div>

      <div class="sidebar-content">
        <div class="nav-section">
          <p class="nav-label">WORKSPACE</p>

          <button class="nav-item active" data-view="dashboard">
            <span class="nav-icon">◫</span>
            <span>Overview</span>
          </button>

          <button class="nav-item" data-view="projects">
            <span class="nav-icon">▧</span>
            <span>Projects</span>
          </button>

          <button class="nav-item" data-view="goals">
            <span class="nav-icon">◎</span>
            <span>Goals</span>
          </button>

          <button class="nav-item" data-view="tasks">
            <span class="nav-icon">☑</span>
            <span>Tasks</span>
          </button>

          <button class="nav-item" data-view="timeline">
            <span class="nav-icon">◷</span>
            <span>Timeline</span>
          </button>
        </div>

        <div class="nav-section">
          <p class="nav-label">THINKING</p>

          <button class="nav-item" data-view="intelligence">
            <span class="nav-icon">✳</span>
            <span>Intelligence</span>
          </button>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="sidebar-footer-mark">M</div>
        <div>
          <strong>Meridian</strong>
          <span>Personal workspace</span>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <span class="topbar-context">Your workspace</span>
        </div>

        <div class="topbar-actions">
          <button class="icon-button" id="commandButton" title="Open command palette">
            ⌘
          </button>

          <button class="icon-button" id="logoutButton" title="Log out">
            ↗
          </button>
        </div>
      </header>

      <section id="app" class="page-content">
        <div class="loading-state">
          <div class="loading-mark">M</div>
          <p>Preparing your workspace...</p>
        </div>
      </section>
    </main>
  </div>

  <!-- Command palette -->
  <div class="command-overlay" id="overlay">
    <div class="command-panel">
      <div class="command-search">
        <span>⌕</span>
        <input
          type="text"
          id="commandInput"
          placeholder="Search or run a command..."
          autocomplete="off"
        >
        <kbd>ESC</kbd>
      </div>

      <div class="command-results" id="commandResults">
        <p class="command-empty">Start typing to find something.</p>
      </div>

      <div class="command-footer">
        <span>MERIDIAN COMMAND</span>
        <span>Navigate your workspace</span>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
